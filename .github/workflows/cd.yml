name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Train, package & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt

      - name: Model version (from pyproject.toml)
        id: v
        run: |
          base="v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "release=$base" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT";
          else echo "version=$base" >> "$GITHUB_OUTPUT"; fi
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Train + quality gate
        run: python -m src.pipeline --version "${{ steps.v.outputs.version }}"
      - name: Model behaviour tests
        run: pytest tests/test_model.py

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build & push image
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMG:${{ steps.v.outputs.version }}" -t "$IMG:sha-${{ steps.v.outputs.sha }}" -t "$IMG:latest" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" .
          docker push --all-tags "$IMG"
          echo "### Image published: \`$IMG:${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish model release (once per version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - bump [project].version in pyproject.toml to publish a new model."
            exit 0
          fi
          python - <<'PY' > release_notes.md
          import json
          r = json.load(open("reports/metrics.json")); t = r["metrics"]["test"]
          print(f"Random Forest model **{r['version']}**, trained on data `{r['data_sha256_16']}`.\n")
          print("| Test MAE | MAPE | R² | Within ±10% |\n|---|---|---|---|")
          print(f"| Rs {t['mae']:,.0f} | {t['mape']:.2f}% | {t['r2']:.3f} | {t['within_10pct']:.1f}% |")
          print("\nThe Streamlit app downloads `vehicle_price_model.joblib` from the latest release.")
          print(f"\nContainer: `ghcr.io/${{ github.repository }}:{r['version']}`")
          PY
          gh release create "$VERSION" models/vehicle_price_model.joblib reports/metrics.json MODEL_CARD.md \
            --target "$GITHUB_SHA" --title "Model $VERSION" --notes-file release_notes.md
